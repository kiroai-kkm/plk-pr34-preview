name: Publish WFB preview
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-wfb.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download polished deck
        run: |
          mkdir -p wfb
          curl -fsSL "https://reproductive-harold-quarter-plug.trycloudflare.com/index.html" -o wfb/index.html
          test "$(wc -c < wfb/index.html)" -gt 100000
          grep -q 'PREVIEW ONLY' wfb/index.html
          grep -q 'preview-banner' wfb/index.html
          rm -f wfb/p0.txt
      - name: Commit to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wfb
          git commit -m "Publish WFB kindergarten training preview"
          git push origin HEAD:gh-pages
