name: publish-wfb-preview
on:
  push:
    paths:
      - .github/workflows/publish-wfb.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fetch merged deck
        run: |
          mkdir -p wfb
          curl -fsSL "https://compaq-show-das-drew.trycloudflare.com/index.html" -o wfb/index.html
          grep -q "Manus" wfb/index.html
          grep -q "AI 音樂、兒歌及律動" wfb/index.html
          grep -q "samples/avatar-xiaoshu-60s.mp4" wfb/index.html
          grep -q "接著：播講師預錄樣本" wfb/index.html
          if grep -q "PREVIEW ONLY" wfb/index.html; then echo "preview banner still present"; exit 1; fi
          if grep -q '音樂歌曲製作' wfb/index.html; then echo "old unit 6 title still present"; exit 1; fi
          test "$(wc -c < wfb/index.html)" -eq 131225
      - name: Commit deck onto gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wfb/index.html
          git commit -m "Publish merged WFB deck from main b7e4571"
          git push origin gh-pages
