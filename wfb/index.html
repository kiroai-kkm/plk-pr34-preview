<style>
:root {

* { box-sizing: border-box; }

/* ---------- slides ---------- */
.slide { position: absolute; inset: 0; display: none; padding: 0; }

.terms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; height: 520px; }

#notes ol, #notes ul { padding-left: 1.3em; margin: 0 0 10px; }
#notes .warn { color: var(--red); font-weight: 700; }
.appx-mark { display: inline-block; margin-left: 16px; vertical-align: middle; font-size: 22px; padding: 2px 12px; border: 2px solid var(--ink); border-radius: 8px; font-weight: 700; }

/* ---------- keyframes ---------- */
@keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
@keyframes fromLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
@keyframes fromRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes signal { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 1; } }

.no-anim, .no-anim * { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- action plan (screen + print) ---------- */
.slide.plan { background: #ffffff; }
.plan-table td { height: 64px; }
.commit { margin-top: 24px; border: 3px solid var(--ink); border-radius: 16px; padding: 16px 24px; font-size: 28px; display: flex; gap: 32px; align-items: center; }
.blank { display: inline-block; min-width: 260px; border-bottom: 3px solid var(--ink); height: 1.2em; }

@media print {
  @page { size: A4 landscape; margin: 12mm; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #viewport { display: none; }
  #print-area { display: block; color: #111; font-family: var(--font); }
  #print-area h1 { font-size: 26pt; margin: 0 0 10pt; }
  #print-area table.t { font-size: 14pt; border-color: #333; }
  #print-area table.t th { background: #fff; border-bottom: 2px solid #333; }
  #print-area .plan-table td { height: 34pt; }
  #print-area .commit { font-size: 16pt; border-color: #333; }
  #print-area .blank { min-width: 160pt; border-color: #333; }
  #print-area .print-credit { margin: 14pt 0 0; font-size: 12pt; }
}

  var t = h.tl[seg - 1];

    t.modes.map(function (m) { return '<span class="tag">' + m + '</span>'; }).join(' ') + '</p>';
}
function moduleHeader(h, seg, points) {
  return segMeta(h, seg) + '<p class="kicker">為何有用</p><ul class="points reveal">' +
    points.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' + h.hookSlot(seg);

  { seg: 1, kind: 'content', title: '香港可用工具地圖', reqs: [23, 15, 16, 14], matrix: true,

        line('家長通訊／通告', h.toolLink('kimi') + ' 或 ' + h.toolLink('yuanbao')) +
        line('觀察記錄', '先寫成［幼兒名］，再用 ' + h.toolLink('deepseek') + ' 或 ' + h.toolLink('kimi')) +

        '</div><p class="small" style="margin:6px 0 0"><b>私隱：</b>不輸入幼兒姓名、照片、家長電話或評估資料。圖像只寫文字描述，不上傳幼兒照片。</p></div>';
      return '<p class="small"><b>今日只用香港可直用、免虛擬私人網絡（VPN）的工具。</b>VPN：令上網連線「繞道」到別處的工具，例如用來開啟香港未支援的網站——今日不會這樣做。</p>' +

    notes: function () { return [
      '綠點代表香港可直接使用；紅點代表官方不支援香港。',

      '教學現場的教案、故事及家長信仍示範 Gemini、DeepSeek 及 Canva。Kimi 與騰訊元寶是回校起草家長通訊的另一條路，不當場改示範工具。',

      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    tlBar.hidden = p.kind === 'cover' || p.seg === 'A';
    $$('#timeline-bar button').forEach(function (b) { b.classList.toggle('now', +b.dataset.seg === p.seg); });
    var fp = $('#footer-provider');
    fp.hidden = !D.footerOn() || p.kind === 'cover' || p.kind === 'closing';
    fp.textContent = D.provider();
    renderNotes();
  }
  function headerOf(seg) { for (var k = 0; k < N; k++) if (pages[k].seg === seg && (pages[k].kind === 'header' || (seg === 1 && pages[k].kind === 'header'))) return k; return 0; }

  /* ---------- scaling (需求 2) ---------- */
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((vw - 1920 * s) / 2) + 'px';
    stage.style.top = Math.round((vh - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', function () { requestAnimationFrame(fit); });
  document.addEventListener('fullscreenchange', function () { requestAnimationFrame(fit); });

  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function toggleFullscreen() {
    var fail = function () { toast('全屏未能啟動，可改用瀏覽器本身的全屏功能（例如 F11）。'); };
    try {
      if (document.fullscreenElement) { document.exitFullscreen().catch(fail); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(fail); }
      else fail();
    } catch (e) { fail(); }
  }

  /* ---------- input ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = e.key, tag = (e.target && e.target.tagName) || '';
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
    if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown') { e.preventDefault(); blurActive(); go(state.index + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); blurActive(); go(state.index - 1); }
    else if (!typing && (k === 'f' || k === 'F')) { e.preventDefault(); toggleFullscreen(); }
    else if (!typing && (k === 'h' || k === 'H')) { e.preventDefault(); toggleNotes(); }
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') e.preventDefault(); });
  function blurActive() { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); }

  document.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var t = e.target;
    if (t.closest('#notes')) return;
    if (t.closest('a[href]')) return;
    var btn = t.closest('button, [data-interactive]');
    if (!btn) { if (t.closest('#stage')) go(state.index + 1); return; }
    if (btn.id === 'session-switch') return switchSession();
    if (btn.closest('#dots') && btn.dataset.go !== undefined) return go(+btn.dataset.go);
    if (btn.closest('#timeline-bar') && btn.dataset.seg) return go(headerOf(+btn.dataset.seg), true);
    if (btn.dataset.goto === 'appendix') return go(pages.findIndex(function (p) { return p.seg === 'A'; }));
    if (btn.dataset.show) {
      var box = btn.parentElement.querySelector('.' + btn.dataset.show);
      if (box) box.classList.add('shown');
      return;
    }
    if (btn.classList.contains('opt-toggle')) {
      var opt = btn.closest('.opt'), open = !opt.classList.contains('open');
      opt.classList.toggle('open', open);
      btn.textContent = open ? '收合' : '展開';
      btn.setAttribute('aria-expanded', String(open));
      return;
    }
    if (btn.classList.contains('term')) { btn.classList.toggle('flipped'); return; }
  });

  /* ---------- start ---------- */
  fit();
  applySession(state.key);
  slides[0].classList.add('current');
  state.index = 0;
  go(0, true);

  window.DECK_RUNTIME = { state: state, go: go, applySession: applySession, switchSession: switchSession, pages: pages, slides: slides, notesHtml: notesHtml, headerOf: headerOf };
})();
</script>
</body>
</html>
