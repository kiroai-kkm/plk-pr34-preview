function segMeta(h, seg) {
  var t = h.tl[seg - 1];
  return '<p class="meta"><b>' + t.start + '–' + t.end + '</b>　建議 ' + h.duration(t) + ' 分鐘　' +
    t.modes.map(function (m) { return '<span class="tag">' + m + '</span>'; }).join(' ') + '</p>';
}
function moduleHeader(h, seg, points) {

function matrixCards(h, group, cols) {
  var list = h.tools(function (e) { return e.group === group && h.hkOK(e.id); });
  return '<div class="mx" style="grid-template-columns:repeat(' + cols + ',1fr)">' + list.map(function (e) {
    var f = function (k) { return h.esc(h.field(e.id, k)); };
    var demo = (e.id === 'gemini' || e.id === DECK.secondId() || e.id === 'canva');
    return '<div class="card' + (demo ? ' accent' : '') + '"><h3><span>' + h.toolLink(e.id) + '</span>' + (demo ? '<span class="tag">這兩日會用</span>' : '') + '</h3>' +
      h.dot(e.id) + '<dl><dt>用途</dt><dd>' + f('use') + '</dd><dt>中文</dt><dd>' + f('zh') + '</dd><dt>起步</dt><dd>' + f('free') + '</dd><dt>適合</dt><dd>' + f('fit') + '</dd><dt>注意</dt><dd>' + f('note') + '</dd></dl>' +
      '<div class="meta">' + h.link(e.url) + '</div>' + (e.id === 'poe' ? '<div class="meta"><b>' + h.poeNote + '</b></div>' : '') + '</div>';
  }).join('') + '</div>';
}

<script id="app">
/* Runtime part 1: utilities, data access, validation (System_Warning) and page helpers */
var DECK = (function () {
  'use strict';
  var CFG = SESSION_CONFIG, REG = REGISTRY;
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var PENDING = '待設定', OK = '香港可直用', NO = '香港不可直用';
  var activeKey = 'manjusri';
  function timelineFor(key) {
    if (typeof TIMELINES !== 'undefined' && TIMELINES && TIMELINES[key]) return TIMELINES[key];
    return TIMELINE;
  }
  function moduleSegs(key) {
    return timelineFor(key).filter(function (t) { return t && t.module; }).map(function (t) { return t.n; });
  }
  var APPROVED = ['C1', 'C2', 'C3', 'C4', 'C5', 'M1', 'M2', 'M3', 'M4', 'M5', 'T1', 'T2', 'T3', 'T4', 'T5'];
  var LABEL = { manjusri: '第一天', mantra: '第二天' };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function empty(v) { return v === undefined || v === null || (typeof v === 'string' && v.trim() === '') || (Array.isArray(v) && v.length === 0); }
  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }
  function utc(s) { var p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function isTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  function weekday(s) { return WEEK[new Date(utc(s)).getUTCDay()]; }
  function chineseDate(s) { var p = s.split('-').map(Number); return p[0] + ' 年 ' + p[1] + ' 月 ' + p[2] + ' 日（' + weekday(s) + '）'; }

  /* ---------- Session_Config ---------- */
  var SESSION_FIELDS = ['label', 'dayName', 'date', 'start', 'end', 'lunchStart', 'lunchEnd', 'school', 'venue', 'headcount', 'factIds', 'facts', 'hooks'];
  function sessionErrors(key) {
    var s = (CFG.sessions || {})[key], bad = [];
    if (!s) return SESSION_FIELDS.slice();
    SESSION_FIELDS.forEach(function (f) { if (empty(s[f]) || (f === 'facts' && typeof s.facts === 'object' && Object.keys(s.facts).length === 0)) bad.push(f); });
    if (bad.indexOf('date') < 0 && !isDate(s.date)) bad.push('date');
    ['start', 'end', 'lunchStart', 'lunchEnd'].forEach(function (f) { if (bad.indexOf(f) < 0 && !isTime(s[f])) bad.push(f); });
    if (bad.indexOf('headcount') < 0 && !(Number.isInteger(s.headcount) && s.headcount > 0)) bad.push('headcount');
    [['start', 'end'], ['lunchStart', 'lunchEnd']].forEach(function (pr) {
      if (bad.indexOf(pr[0]) < 0 && bad.indexOf(pr[1]) < 0 && mins(s[pr[0]]) >= mins(s[pr[1]])) { bad.push(pr[0]); bad.push(pr[1]); }
    });
    return bad;
  }
  function S(key, field) {
    var s = (CFG.sessions || {})[key];
    return (s && sessionErrors(key).indexOf(field) < 0) ? s[field] : PENDING;
  }
  function sharedErrors() {
    var sh = CFG.shared || {}, bad = [];
    ['providerConstant', 'footerProvider', 'secondTool', 'buildDate', 'facts'].forEach(function (f) { if (empty(sh[f])) bad.push(f); });
    if (bad.indexOf('footerProvider') < 0 && ['開啟', '關閉'].indexOf(sh.footerProvider) < 0) bad.push('footerProvider');
    if (bad.indexOf('secondTool') < 0 && ['DeepSeek', 'Qwen'].indexOf(sh.secondTool) < 0) bad.push('secondTool');
    if (bad.indexOf('buildDate') < 0 && !isDate(sh.buildDate)) bad.push('buildDate');
    if (bad.indexOf('facts') < 0 && ['C1', 'C2', 'C3', 'C4', 'C5'].some(function (c) { return empty(sh.facts[c]); })) bad.push('facts');
    return bad;
  }
  function shared(f) { return sharedErrors().indexOf(f) < 0 ? CFG.shared[f] : null; }
  function provider() { return shared('providerConstant') || PENDING; }
  function footerOn() { return shared('footerProvider') === '開啟'; }
  function secondKey() { return shared('secondTool') || 'DeepSeek'; }
  function secondId() { return secondKey().toLowerCase(); }
  function secondName() { var e = entry(secondId()); return (e && e.name) || secondKey(); }
  function resolveTool(t) { return t === 'second' ? secondId() : t; }

  function hookProblems(key, hook) {
    var s = CFG.sessions[key] || {}, allowed = Array.isArray(s.factIds) ? s.factIds : [], why = [];
    if (!hook || !Array.isArray(hook.facts) || hook.facts.length === 0) why.push('沒有引用事實編號');
    else hook.facts.forEach(function (f) {
      if (APPROVED.indexOf(f) < 0) why.push(f + ' 不屬 Approved_Fact_List');
      else if (allowed.indexOf(f) < 0) why.push(f + ' 不屬此場次可引用的事實');
    });
    if (!hook || moduleSegs(key).indexOf(hook.seg) < 0) why.push('所屬時段不是單元時段');
    if (!hook || empty(hook.text)) why.push('沒有文字');
    return why;
  }
  function validHooks(key, seg) {
    var s = CFG.sessions[key];
    if (!s || !Array.isArray(s.hooks)) return [];
    return s.hooks.filter(function (h) { return h && h.seg === seg && hookProblems(key, h).length === 0; });
  }

  /* ---------- Availability_Registry ---------- */
  var BY_ID = {};
  REG.forEach(function (e) { if (e && e.id) BY_ID[e.id] = e; });
  var ENUMS = {
    category: ['工具', '功能', '教育方案', '政策'], hk: [OK, NO], group: ['主力', '也很實用', '一句帶過', '不列入'],
    zh: ['佳', '良', '一般'], fit: ['高', '中', '低'], kind: ['文字', '圖像生成', '動畫', '數字人', '語音', '音樂'],
    fee: ['免費', '付費', '需 Canva Education'], region: ['有', '沒有'], route: ['老師個人', '整校申請', '機構購買'], kgDefault: ['適用', '不適用']
  };
  var REQ = {
    '工具': ['url', 'hk', 'group', 'use', 'zh', 'free', 'fit', 'note'],
    '功能': ['tool', 'kind', 'hk', 'fee', 'region'],
    '教育方案': ['org', 'audience', 'route', 'fee', 'privacy', 'kgDefault'],
    '政策': ['issuer', 'scope']
  };
  function verifiedOK(e) {
    if (!isDate(e.verified)) return false;
    var bd = shared('buildDate');
    return !bd || utc(e.verified) <= utc(bd);
  }
  function entryErrors(e) {
    var bad = [];
    ['id', 'name', 'category', 'claim', 'source', 'verified'].forEach(function (f) { if (empty(e[f])) bad.push(f); });
    if (bad.indexOf('category') < 0 && ENUMS.category.indexOf(e.category) < 0) bad.push('category');
    if (bad.indexOf('verified') < 0 && !verifiedOK(e)) bad.push('verified');
    (REQ[e.category] || []).forEach(function (f) {
      if (empty(e[f])) bad.push(f);
      else if (ENUMS[f] && !(f === 'fee' && e.category === '教育方案') && ENUMS[f].indexOf(e[f]) < 0) bad.push(f);
    });
    if (e.category === '工具' && e.hk === NO && empty(e.alt)) bad.push('alt');
    if (e.category === '功能' && e.tool && !BY_ID[e.tool]) bad.push('tool');
    return bad;
  }
  function entry(id) { return BY_ID[id] || null; }
  function hkOK(id) { var e = entry(id); return !!e && e.hk === OK; }
  function field(id, f) { var e = entry(id); if (!e) return PENDING; return entryErrors(e).indexOf(f) < 0 ? e[f] : PENDING; }
  function verifiedText(id) { var e = entry(id); return (e && verifiedOK(e)) ? e.verified : '未註明日期'; }
  function tools(filter) { return REG.filter(function (e) { return e.category === '工具' && (!filter || filter(e)); }); }
  function functions(kinds) { return REG.filter(function (e) { return e.category === '功能' && kinds.indexOf(e.kind) >= 0 && e.hk === OK; }); }

  /* ---------- timeline ---------- */
  function timelineProblems(key) {
    var s = CFG.sessions[key] || {}, tl = timelineFor(key), out = [];
    function add(n, code) { out.push({ n: n, code: code }); }
    if (!Array.isArray(tl) || tl.length < 3) { add('全部', 'a'); return out; }
    var allowed = ['示範', '動手做', '討論'];
    tl.forEach(function (t, i) {
      var n = (t && t.n) || (i + 1);
      if (!t || t.n !== i + 1) add(n, 'a');
      if (!t || !isTime(t.start) || !isTime(t.end) || mins(t.start) >= mins(t.end)) add(n, 'b');
      var nx = tl[i + 1];
      if (nx && t && isTime(t.end) && isTime(nx.start) && t.end !== nx.start) add(t.n, 'c');
      var modes = (t && t.modes) || [];
      var isLunch = !!(t && s.lunchStart && t.start === s.lunchStart && t.end === s.lunchEnd);
      var good = modes.every(function (m) { return allowed.indexOf(m) >= 0; });
      if (isLunch) { if (modes.length !== 0) add(n, 'f'); }
      else if (modes.length < 1 || modes.length > 3 || !good) add(n, 'f');
    });
    if (tl[0] && s.start && tl[0].start !== s.start) add(1, 'd');
    var last = tl[tl.length - 1];
    if (last && s.end && last.end !== s.end) add(last.n, 'd');
    var lunches = tl.filter(function (t) { return t && t.start === s.lunchStart && t.end === s.lunchEnd; });
    if (lunches.length !== 1) add('午膳', 'e');
    return out;
  }
  function duration(t) { return (isTime(t.start) && isTime(t.end) && mins(t.start) < mins(t.end)) ? String(mins(t.end) - mins(t.start)) : PENDING; }

  /* ---------- System_Warning (需求 5 第 6 項) ---------- */
  function warnings(key, pages) {
    var w = [], label = LABEL[key] + '（' + key + '）';
    var se = sessionErrors(key);
    if (se.length) w.push(['需求 11 第 9 項', label + '欄位出錯：' + se.join('、')]);
    var sh = sharedErrors();
    if (sh.length) w.push(['需求 11 第 10 項', '共用設定欄位出錯：' + sh.join('、')]);
    var s = CFG.sessions[key];
    if (s && Array.isArray(s.hooks)) s.hooks.forEach(function (h, i) {
      var why = hookProblems(key, h);
      if (why.length) w.push(['需求 11 第 12 項', label + '第 ' + (i + 1) + ' 個校本例子（時段 ' + (h && h.seg) + '）：' + why.join('；')]);
    });
    var miss = moduleSegs(key).filter(function (seg) { return validHooks(key, seg).length === 0; });
    if (miss.length) w.push(['需求 18 第 5 項', label + '以下時段沒有有效校本例子：' + miss.map(function (n) { return '時段' + n; }).join('、')]);
    REG.forEach(function (e, i) { var b = entryErrors(e); if (b.length) w.push(['需求 14 第 10 項', '第 ' + (i + 1) + ' 項 ' + (e.name || '') + ' 欄位出錯：' + b.join('、')]); });
    var sd = S(key, 'date'), stale = REG.filter(function (e) {
      if (!verifiedOK(e)) return true;
      return sd !== PENDING && (utc(sd) - utc(e.verified)) / 86400000 > 30;
    });
    if (stale.length) w.push(['需求 14 第 8 項', '以下 ' + stale.length + ' 項須於場次前重新核實。' + stale.map(function (e) { return '第 ' + (REG.indexOf(e) + 1) + ' 項 ' + e.name + '（' + verifiedText(e.id) + '）'; }).join('；')]);
    var watch = {};
    ['gemini', secondId(), 'canva'].forEach(function (id) { watch[id] = 1; });
    tools(function (e) { return ['主力', '也很實用', '一句帶過'].indexOf(e.group) >= 0; }).forEach(function (e) { watch[e.id] = 1; });
    pages.forEach(function (p) { (p.uses || []).forEach(function (id) { watch[id] = 1; }); });
    function affected(id) {
      var out = [];
      pages.forEach(function (p, i) {
        if ((p.uses || []).indexOf(id) >= 0 || (p.tool && resolveTool(p.tool) === id) || (p.matrix && entry(id) && entry(id).group !== '不列入')) out.push(i + 1);
      });
      return out.length ? out.join('、') : '—';
    }
    Object.keys(watch).forEach(function (id) {
      if (!hkOK(id)) w.push(['需求 15 第 6 項', (entry(id) ? entry(id).name : id) + ' 不是「香港可直用」，受影響頁：' + affected(id)]);
    });
    ['chatgpt', 'claude'].forEach(function (id) {
      if (hkOK(id)) w.push(['需求 15 第 6 項', entry(id).name + ' 已變為「香港可直用」，請更新講解說法，受影響頁：' + affected(id)]);
    });
    var tp = timelineProblems(key);
    if (tp.length) w.push(['需求 22 第 3 項', '時間軸不符合條件：' + tp.map(function (x) { return '時段' + x.n + '（' + x.code + '）'; }).join('、')]);
    return w;
  }

  function link(url, label) {
    var raw = String(url || '').trim();
    var href = /^https?:\/\//i.test(raw) ? raw : (/^[\w.-]+\.[A-Za-z]{2,}/.test(raw) ? 'https://' + raw : '');
    var host = raw.replace(/^https?:\/\//i, '').replace(/\/$/, '').split('/')[0].replace(/^www\./, '');
    var text = label || host;
    if (!href) return esc(text);
    return '<a class="ext" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>';
  }
  function toolLink(id) { var e = entry(id); return e ? link(e.url, e.name) : esc(id); }

  /* ---------- helpers used by pages.js ---------- */
  var h = {
    esc: esc,
    second: secondName,
    toolName: function (t) { var id = resolveTool(t); return entry(id) ? entry(id).name : id; },
    dot: function (id) {
      var ok = hkOK(id);
      return '<span class="st ' + (ok ? 'ok' : 'no') + '" data-st="' + esc(id) + '"><span class="d" aria-hidden="true"></span><span>' + (ok ? OK : NO) + '</span></span>';
    },
    link: link,
    toolLink: toolLink,
    disclaimer: function () { return '<div class="disclaimer">以官方當日為準</div>'; },
    bind: function (name) { return '<span data-bind="' + name + '"></span>'; },
    ready: function () { return '<span class="tag warm ready">回校可以用</span>'; },
    hookSlot: function (seg) { return '<div class="hook" data-hook-slot="' + seg + '"></div>'; },
    opt: function (title, body) {
      return '<div class="opt" data-interactive><div class="opt-head"><span class="tag plain">選做</span><b>' + title +
        '</b><button type="button" class="opt-toggle" data-interactive aria-expanded="false">展開</button></div><div class="opt-body">' + body + '</div></div>';
    },
    answer: function (body) {
      return '<div><button type="button" class="ctl" data-show="answer" data-interactive>顯示範例答案</button>' +
        '<div class="answer"><span class="label">範例答案：</span>' + body + '</div></div>';
    },
    fallback: function (body) {
      return '<div><button type="button" class="ctl" data-show="fallback" data-interactive>顯示示例輸出</button>' +
        '<div class="fallback"><div class="label">示例輸出</div>' + body + '</div></div>';
    },
    poeNote: 'Poe 不是 ChatGPT／Claude 官方帳戶',
    entry: entry, field: field, hkOK: hkOK, tools: tools, functions: functions, reg: REG, tl: timelineFor('manjusri'), duration: duration,
    seriesMap: function () {
      return '<div class="grid g2">' + ['manjusri', 'mantra'].map(function (key) {
        var s = (CFG.sessions || {})[key] || {};
        var bits = key === 'mantra'
          ? ['繪本分鏡與 Canva 組頁', 'Canva 進階、素養與微動畫', '數字人腳本、兒歌與行動計劃']
          : ['Prompt、教案與家長信', 'Gemini 檔案工作室', 'Canva 入門海報'];
        var here = key === activeKey;
        return '<div class="card' + (here ? ' accent' : '') + '"><h3>' + esc(s.dayName || '') + (here ? '　<span class="tag">今日</span>' : '') + '</h3>' +
          '<p class="small">' + (isDate(s.date) ? chineseDate(s.date) : '') + '<br>地點：' + esc(s.venue || '') + '</p>' +
          '<ul class="points small">' + bits.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
      }).join('') + '</div>';
    },
    fee: function (id) { var f = field(id, 'fee'); return '<span class="tag plain">' + esc(f) + '</span>'; },
    shared: function (f) { return shared(f); }
  };

  var api = {
    CFG: CFG, REG: REG, TL: timelineFor('manjusri'), LABEL: LABEL, PENDING: PENDING, MODULE_SEGS: moduleSegs('manjusri'),
    esc: esc, isDate: isDate, weekday: weekday, chineseDate: chineseDate,
    sessionErrors: sessionErrors, sharedErrors: sharedErrors, S: S, provider: provider, footerOn: footerOn,
    secondName: secondName, secondId: secondId, resolveTool: resolveTool, validHooks: validHooks, hookProblems: hookProblems,
    entry: entry, entryErrors: entryErrors, hkOK: hkOK, verifiedText: verifiedText, timelineProblems: timelineProblems,
    duration: duration, warnings: warnings, h: h,
    timeline: timelineFor, moduleSegs: moduleSegs,
    setActive: function (key) {
      activeKey = (CFG.sessions && CFG.sessions[key]) ? key : 'manjusri';
      var tl = timelineFor(activeKey);
      h.tl = tl;
      api.TL = tl;
      api.MODULE_SEGS = moduleSegs(activeKey);
    }
  };
  return api;
})();

/* Runtime part 2: rendering, navigation, session switching, interactions */
(function () {
  'use strict';
  var D = DECK, h = D.h;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var stage = $('#stage'), slidesEl = $('#slides'), notesEl = $('#notes');
  var dots = $('#dots'), tlBar = $('#timeline-bar'), printArea = $('#print-area');
  var state = { key: 'manjusri', index: 0 };
  var pages = [];
  var slides = [];
  var N = 0;

  /* ---------- web font: never wait longer than 3 s (需求 1 第 5 項) ---------- */
  var font = $('#webfont');
  setTimeout(function () { if (font && !font.dataset.loaded) font.remove(); }, 3000);

  /* ---------- initial session from URL (需求 12 第 1 至 3 項) ---------- */
  var params = new URLSearchParams(location.search);
  if (params.has('school')) {
    var v = (params.get('school') || '').toLowerCase();
    if (v === 'manjusri' || v === 'mantra') state.key = v;
    else console.warn('URL 參數 school 的值無效：「' + params.get('school') + '」，已改用 manjusri。');
  }

  /* ---------- build the active day's slides ---------- */
  function dayOf(key) { return key === 'mantra' ? 2 : 1; }
  function mount(key) {
    D.setActive(key);
    var next = PAGES.filter(function (p) { return p && (p.day === dayOf(key) || p.day === 0); });
    pages.splice(0, pages.length);
    next.forEach(function (p) { pages.push(p); });
    N = pages.length;
    slidesEl.innerHTML = '';
    dots.innerHTML = '';
    tlBar.innerHTML = '';
    pages.forEach(function (p, i) {
      var sec = document.createElement('section');
      sec.className = 'slide' + (p.cls ? ' ' + p.cls : '');
      sec.dataset.i = i;
      sec.dataset.seg = p.seg;
      sec.dataset.reqs = (p.reqs || []).join(',');
      sec.dataset.kind = p.kind;
      if (p.cat) sec.dataset.cat = p.cat;
      if (p.tool) sec.dataset.tool = D.resolveTool(p.tool);
      var body = p.html(h, p);
      sec.innerHTML = p.raw ? body : '<h1>' + p.title + (p.seg === 'A' ? '<span class="appx-mark">附錄</span>' : '') + '</h1><div class="content">' + body + '</div>';
      slidesEl.appendChild(sec);
    });
    slides = $$('.slide', slidesEl);
    pages.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.interactive = ''; b.dataset.go = i; b.dataset.seg = p.seg;
      if (i > 0 && pages[i - 1].seg !== p.seg) b.className = 'seg-gap';
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 頁');
      b.innerHTML = '<i></i>';
      dots.appendChild(b);
    });
    D.timeline(key).forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.interactive = ''; b.dataset.seg = t.n;
      b.textContent = t.start + ' ' + t.short;
      tlBar.appendChild(b);
    });
    printArea.innerHTML = '';
    var planSlide = slides.filter(function (s) { return s.classList.contains('plan'); })[0];
    if (planSlide) {
      printArea.innerHTML = planSlide.innerHTML.replace(/<span class="appx-mark">.*?<\/span>/, '');
      printArea.insertAdjacentHTML('beforeend', '<p class="print-credit">培訓機構：<span data-bind="provider"></span></p>');
    }
  }

  /* ---------- session application (需求 11、12) ---------- */
  function binds(key) {
    var S = function (f) { return D.S(key, f); }, P = D.PENDING;
    var date = S('date'), st = S('start'), en = S('end'), ls = S('lunchStart'), le = S('lunchEnd');
    return {
      school: S('school'), venue: S('venue'), label: S('label'),
      date: date === P ? P : D.chineseDate(date),
      time: (st === P || en === P) ? P : st + '–' + en,
      lunch: (ls === P || le === P) ? P : ls + '–' + le,
      afternoon: le === P ? P : '下午 ' + le + ' 開始',
      provider: D.provider(),
      dayName: S('dayName')
    };
  }
  function applySession(key) {
    state.key = key;
    mount(key);
    var b = binds(key);
    $$('[data-bind]').forEach(function (el) { var v = b[el.dataset.bind]; if (v !== undefined && el.textContent !== v) el.textContent = v; });
    $$('[data-hook-slot]').forEach(function (slot) {
      var hooks = D.validHooks(key, +slot.dataset.hookSlot);
      slot.hidden = hooks.length === 0;
      slot.innerHTML = hooks.map(function (x) { return '<div class="hook-item"><span class="tag warm">校本例子</span>' + D.esc(x.text) + '</div>'; }).join('');
    });
    $('#session-tag').textContent = b.dayName;
    var other = key === 'manjusri' ? 'mantra' : 'manjusri';
    var ob = binds(other);
    $('#session-switch').textContent = '切換到' + ob.dayName;
    state.index = 0;
    go(0, true);
  }
  function switchSession() {
    var next = state.key === 'manjusri' ? 'mantra' : 'manjusri';
    applySession(next);
    try {
      var u = new URL(location.href);
      u.searchParams.set('school', next);
      history.replaceState(history.state, '', u.toString());
    } catch (e) {
      console.warn('URL 參數 school 未能更新：' + e.message);
    }
  }

  /* ---------- notes (需求 5) ---------- */
  function notesHtml() {
    var p = pages[state.index], out = [], i = state.index;
    if (p.kind === 'cover') {
      var w = D.warnings(state.key, pages);
      out.push('<h2>系統警告</h2>');
      out.push(w.length ? '<ol>' + w.map(function (x) { return '<li class="warn">警告（' + x[0] + '）：' + D.esc(x[1]) + '</li>'; }).join('') + '</ol>' : '<p>目前沒有系統警告。</p>');
    }
    if (p.kind === 'header') {
      var tlNow = D.timeline(state.key);
      var t = tlNow[p.seg - 1];
      if (t) out.push('<p><b>時段 ' + t.n + '：' + t.start + '–' + t.end + '</b>' + (t.modes.length ? '；形式：' + t.modes.join('、') : '') + '</p>');
    }
    if (p.kind === 'live') {
      if (!D.hkOK(D.resolveTool(p.tool))) out.push('<p class="warn">此工具狀態已變更，請改用示例輸出。</p>');
      var steps = typeof p.steps === 'function' ? p.steps(h, p) : p.steps;
      out.push('<h2>示範步驟</h2><ol>' + steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>');
      out.push(p.goal ? '<p><b>操作目標：</b>' + D.esc(p.goal) + '</p>' : '<p><b>Prompt 原文：</b>' + D.esc(p.prompt) + '</p>');
      out.push('<p>網絡或工具失效時，按「顯示示例輸出」。</p>');
    }
    var pts = p.notes(h, p);
    out.push('<h2>講解重點（第 ' + (i + 1) + ' 頁）</h2><ul>' + pts.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>');
    return out.join('');
  }
  function renderNotes() { if (!notesEl.hidden) notesEl.innerHTML = notesHtml(); }
  function toggleNotes() { notesEl.hidden = !notesEl.hidden; if (!notesEl.hidden) { notesEl.innerHTML = notesHtml(); notesEl.scrollTop = 0; } }

  /* ---------- navigation (需求 3、4、22) ---------- */
  function resetPage(sec) {
    $$('.answer.shown, .fallback.shown', sec).forEach(function (el) { el.classList.remove('shown'); });
    $$('.opt.open', sec).forEach(function (el) { el.classList.remove('open'); var b = $('.opt-toggle', el); b.textContent = '展開'; b.setAttribute('aria-expanded', 'false'); });
    $$('.term.flipped', sec).forEach(function (el) { el.classList.remove('flipped'); });
  }
  function go(i, force) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === state.index && !force) return;
    var old = slides[state.index];
    old.classList.remove('current');
    state.index = i;
    var cur = slides[i];
    resetPage(cur);
    cur.classList.add('current');
    var p = pages[i];
    $('#page-indicator').textContent = (i + 1) + ' / ' + N;
    var prevBtn = $('#page-prev'), nextBtn = $('#page-next');
    if (prevBtn) prevBtn.disabled = i <= 0;
    if (nextBtn) nextBtn.disabled = i >= N - 1;
    $$('#dots button').forEach(function (b, k) {
      var on = k === i;
      b.classList.toggle('now', on);
      b.classList.toggle('seg-on', b.dataset.seg === String(p.seg));
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    tlBar.hidden = p.kind === 'cover' || p.seg === 'A';
    $$('#timeline-bar button').forEach(function (b) { b.classList.toggle('now', +b.dataset.seg === p.seg); });
    var fp = $('#footer-provider');
    fp.hidden = !D.footerOn() || p.kind === 'cover' || p.kind === 'closing';
    fp.textContent = D.provider();
    renderNotes();
  }
  function headerOf(seg) { for (var k = 0; k < N; k++) if (pages[k].seg === seg && (pages[k].kind === 'header' || (seg === 1 && pages[k].kind === 'header'))) return k; return 0; }

  /* ---------- scaling (需求 2) ---------- */
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((vw - 1920 * s) / 2) + 'px';
    stage.style.top = Math.round((vh - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', function () { requestAnimationFrame(fit); });
  document.addEventListener('fullscreenchange', function () { requestAnimationFrame(fit); });

  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function toggleFullscreen() {
    var fail = function () { toast('全屏未能啟動，可改用瀏覽器本身的全屏功能（例如 F11）。'); };
    try {
      if (document.fullscreenElement) { document.exitFullscreen().catch(fail); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(fail); }
      else fail();
    } catch (e) { fail(); }
  }

  /* ---------- input ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = e.key, tag = (e.target && e.target.tagName) || '';
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
    if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown') { e.preventDefault(); blurActive(); go(state.index + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); blurActive(); go(state.index - 1); }
    else if (!typing && (k === 'f' || k === 'F')) { e.preventDefault(); toggleFullscreen(); }
    else if (!typing && (k === 'h' || k === 'H')) { e.preventDefault(); toggleNotes(); }
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') e.preventDefault(); });
  function blurActive() { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); }

  document.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var t = e.target;
    if (t.closest('#notes')) return;
    if (t.closest('a[href]')) return;
    var btn = t.closest('button, [data-interactive]');
    if (!btn) { if (t.closest('#stage')) go(state.index + 1); return; }
    if (btn.id === 'session-switch') return switchSession();
    if (btn.id === 'page-prev') return go(state.index - 1);
    if (btn.id === 'page-next') return go(state.index + 1);
    if (btn.closest('#dots') && btn.dataset.go !== undefined) return go(+btn.dataset.go);
    if (btn.closest('#timeline-bar') && btn.dataset.seg) return go(headerOf(+btn.dataset.seg), true);
    if (btn.dataset.goto === 'appendix') return go(pages.findIndex(function (p) { return p.seg === 'A'; }));
    if (btn.dataset.show) {
      var box = btn.parentElement.querySelector('.' + btn.dataset.show);
      if (box) box.classList.add('shown');
      return;
    }
    if (btn.classList.contains('opt-toggle')) {
      var opt = btn.closest('.opt'), open = !opt.classList.contains('open');
      opt.classList.toggle('open', open);
      btn.textContent = open ? '收合' : '展開';
      btn.setAttribute('aria-expanded', String(open));
      return;
    }
    if (btn.classList.contains('term')) { btn.classList.toggle('flipped'); return; }
  });

  /* ---------- start ---------- */
  fit();
  applySession(state.key);

  window.DECK_RUNTIME = { state: state, go: go, applySession: applySession, switchSession: switchSession, pages: pages, notesHtml: notesHtml, headerOf: headerOf };
  Object.defineProperty(window.DECK_RUNTIME, 'slides', { get: function () { return slides; } });
})();
</script>
</body>
