<style>
:root {
  --bg: hsl(42 62% 95%);
  --ink: #1d2a2e;
  --muted: #45555a;
  --accent: hsl(182 70% 24%);
  --accent-soft: hsl(182 45% 90%);

  --card: #ffffff;
  --line: hsl(40 25% 78%);
  --green: #1e7a3c;
  --red: #b3261e;
  --dot-off: hsl(200 10% 46%);

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2f31; }
body { font-family: var(--font); color: var(--ink); }
#viewport { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#print-area { display: none; }

/* ---------- slides ---------- */
.slide { position: absolute; inset: 0; display: none; padding: 0; }
.slide.current { display: block; animation: slideIn 450ms ease-out both; }
.slide h1 { position: absolute; left: 96px; top: 56px; width: 1360px; margin: 0; font-size: 52px; line-height: 1.25; font-weight: 700; }
.slide .content { position: absolute; left: 96px; right: 96px; top: 176px; bottom: 184px; font-size: 30px; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty; }
.slide.full .content { top: 120px; }
.kicker { font-size: 22px; color: var(--accent); font-weight: 700; letter-spacing: 0.04em; }
p { margin: 0 0 16px; }
ul.points, ol.points { margin: 0; padding-left: 1.2em; }
ul.points li, ol.points li { margin: 0 0 14px; }
.small { font-size: 24px; line-height: 1.45; }
.meta { font-size: 20px; color: var(--muted); }
.grid { display: grid; gap: 24px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.row { display: flex; gap: 24px; align-items: flex-start; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 20px 24px; }
.card h3 { margin: 0 0 8px; font-size: 28px; }
.card.accent { border-color: var(--accent); }
.tag { display: inline-block; max-width: 100%; font-size: 20px; font-weight: 700; padding: 2px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); vertical-align: middle; word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tag.warm { background: hsl(28 80% 93%); color: var(--accent-2); border-color: var(--accent-2); }
.tag.plain { background: #fff; color: var(--ink); border-color: var(--line); }
.ready { position: absolute; right: 0; top: -58px; }
.disclaimer { position: absolute; right: 0; top: -58px; font-size: 20px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px; }
.box { border-left: 8px solid var(--accent); background: #fff; border-radius: 12px; padding: 16px 24px; }
.prompt { font-size: 24px; line-height: 1.5; background: #fff; border: 2px dashed var(--accent); border-radius: 12px; padding: 16px 20px; word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty; }
a.ext { color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
a.ext:hover { color: var(--accent-2); }
.hook { margin-top: 24px; background: hsl(28 80% 95%); border: 2px solid var(--accent-2); border-radius: 16px; padding: 14px 22px; font-size: 26px; }
.hook .tag { margin-right: 12px; }
.hook-item + .hook-item { margin-top: 8px; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 24px; line-height: 1.35; background: #fff; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
table.t th, table.t td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
table.t th { background: var(--accent-soft); color: var(--ink); font-weight: 700; white-space: nowrap; }
table.t td.nw { white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }

/* ---------- status dot ---------- */
.st { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 22px; }
.st .d { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.st.ok .d { background: var(--green); }

.slide.current .st .d { animation: pulse 500ms ease-out 1 both; }

.mx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.mx .card { padding: 14px 18px; font-size: 22px; line-height: 1.32; }

button.ctl { font: inherit; font-size: 22px; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 12px; padding: 8px 20px; cursor: pointer; }

.answer, .fallback { display: none; }
.answer.shown, .fallback.shown { display: block; }
.answer, .fallback { margin-top: 14px; background: #fff; border: 2px solid var(--accent); border-radius: 14px; padding: 12px 18px; font-size: 22px; line-height: 1.42; }
.fallback .label, .answer .label { font-weight: 700; color: var(--accent); }
.opt { margin-top: 12px; border: 2px dashed var(--line); border-radius: 14px; padding: 8px 16px; background: #fffdf8; }
.opt .opt-head { display: flex; gap: 12px; align-items: center; font-size: 22px; }
.opt .opt-body { display: none; font-size: 22px; margin-top: 8px; line-height: 1.42; }
.opt.open .opt-body { display: block; }
.opt-toggle { font: inherit; font-size: 20px; background: #fff; border: 2px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 2px 12px; cursor: pointer; }

/* ---------- term cards ---------- */
.terms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; height: 520px; }
.term { display: block; height: 100%; perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; font: inherit; color: inherit; text-align: left; }
.term .inner { display: block; position: relative; width: 100%; height: 100%; transition: transform 450ms ease; transform-style: preserve-3d; }
.term.flipped .inner { transform: rotateY(180deg); }
.term .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; justify-content: center; gap: 16px; background: #fff; border: 3px solid var(--accent); }
.term .front { align-items: center; text-align: center; font-size: 40px; font-weight: 700; }
.term .back { transform: rotateY(180deg); font-size: 28px; }
.term .hint { font-size: 20px; color: var(--muted); font-weight: 400; }

/* ---------- step flow ---------- */
.flow { display: flex; align-items: stretch; gap: 0; }
.flow .step { flex: 1; background: #fff; border: 3px solid var(--accent); border-radius: 16px; padding: 18px; font-size: 26px; text-align: center; }
.flow .step b { display: block; font-size: 30px; margin-bottom: 6px; }
.flow svg.link { flex: 0 0 56px; height: 40px; align-self: center; }
.flow svg.link line { stroke: var(--accent); stroke-width: 6; stroke-dasharray: 60; stroke-dashoffset: 0; }
.slide.current .flow svg.link line { animation: draw 350ms ease-out both; }
.chips { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.chip { max-width: 100%; font-size: 24px; padding: 6px 16px; border-radius: 999px; background: #fff; border: 2px solid var(--accent-2); color: var(--accent-2); font-weight: 700; word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.redcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.redcard { background: #fff; border: 4px solid var(--red); border-radius: 18px; padding: 36px 24px; font-size: 32px; font-weight: 700; text-align: center; }

/* ---------- bad vs good prompt ---------- */
.vs { display: grid; grid-template-columns: 1fr 1.6fr; gap: 32px; }
.slide.current .vs .bad { animation: fromLeft 450ms ease-out both; }
.slide.current .vs .good { animation: fromRight 450ms ease-out both; }
.part { display: inline-block; max-width: 100%; border-radius: 8px; padding: 2px 8px; font-weight: 700; border: 2px solid; vertical-align: middle; word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.part small { display: inline; font-size: 18px; font-weight: 700; margin-right: 4px; white-space: nowrap; }
.parts { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; }
.parts .part { margin: 0; min-width: 0; }
.tpl { gap: 8px 16px; }
.tpl .card { padding: 8px 12px; }
.tpl b { font-size: 22px; }
.tpl .parts { gap: 4px 8px; }
.tpl .part { font-size: 18px; line-height: 1.35; padding: 1px 6px; }
.p1 { background: hsl(182 60% 92%); border-color: hsl(182 70% 26%); }
.p2 { background: hsl(28 85% 92%); border-color: hsl(28 80% 34%); }
.p3 { background: hsl(260 60% 94%); border-color: hsl(260 45% 40%); }
.p4 { background: hsl(140 50% 92%); border-color: hsl(140 55% 26%); }
.p5 { background: hsl(340 70% 94%); border-color: hsl(340 60% 38%); }

/* ---------- reveal list ---------- */
.slide.current .reveal > * { animation: rise 300ms ease-out both; }
.slide.current .reveal > *:nth-child(2) { animation-delay: 90ms; }
.slide.current .reveal > *:nth-child(3) { animation-delay: 180ms; }
.slide.current .reveal > *:nth-child(4) { animation-delay: 270ms; }
.slide.current .reveal > *:nth-child(5) { animation-delay: 360ms; }

/* ---------- neural network ---------- */
.nn circle { fill: #fff; stroke: var(--accent); stroke-width: 4; }
.nn line { stroke: hsl(182 30% 60%); stroke-width: 3; }
.nn text { font-size: 28px; fill: var(--ink); font-family: var(--font); }
.slide.current .nn .pulse { animation: signal 1800ms ease-in-out 1 both; }

/* ---------- chrome ---------- */
#session-bar { position: absolute; right: 40px; top: 24px; display: flex; gap: 12px; align-items: center; z-index: 5; }
.session-tag { font-size: 20px; font-weight: 700; background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 10px; }

#timeline-bar button:first-child { border-radius: 12px 0 0 12px; }

#dots { position: absolute; left: 0; right: 0; top: 984px; height: 32px; display: flex; justify-content: center; z-index: 4; }

#footer-provider { position: absolute; right: 48px; top: 1032px; font-size: 18px; color: var(--muted); z-index: 4; }

#notes { position: absolute; right: 24px; top: 90px; width: 720px; max-height: 800px; overflow: auto; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 20px 26px; font-size: 22px; line-height: 1.5; z-index: 8; box-shadow: 0 12px 40px rgb(0 0 0 / 25%); }

/* ---------- keyframes ---------- */
@keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
@keyframes fromLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
@keyframes fromRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ---------- action plan (screen + print) ---------- */
.slide.plan { background: #ffffff; }
.plan-table td { height: 64px; }

<div id="viewport">
  <div id="stage" aria-live="polite">
    <div id="slides"></div>
    <div id="session-bar" data-interactive>
      <span id="session-tag" class="session-tag"></span>
      <button id="session-switch" type="button" data-interactive></button>
    </div>
    <nav id="timeline-bar" aria-label="全日時間軸" data-interactive></nav>
    <div id="dots" aria-label="頁面進度" data-interactive></div>
    <div id="page-indicator"></div>
    <div id="footer-provider" hidden></div>
    <div id="toast" role="status" hidden></div>
    <aside id="notes" hidden aria-label="講者備註"></aside>
  </div>
</div>
<div id="print-area" data-print></div>
<script id="pages">
var PAGES = [];
/* Pages: shared builders + 時段一、時段二（第 1 至 14 頁） */
function segMeta(h, seg) {
  var t = h.tl[seg - 1];
  return '<p class="meta"><b>' + t.start + '–' + t.end + '</b>　建議 ' + h.duration(t) + ' 分鐘　' +
    t.modes.map(function (m) { return '<span class="tag">' + m + '</span>'; }).join(' ') + '</p>';
}
function moduleHeader(h, seg, points) {
  return segMeta(h, seg) + '<p class="kicker">為何有用</p><ul class="points reveal">' +
    points.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' + h.hookSlot(seg);
}
function exercise(h, task, steps, toolText, answer) {
  return '<p><span class="tag">2 分鐘小試</span></p><p><b>任務：</b>' + task + '</p><ol class="points">' +
    steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol><p class="small"><b>工具：</b>' + toolText + '</p>' + h.answer(answer);
}
function partsHtml(parts, labelled) {
  var names = ['角色', '對象', '任務', '限制', '輸出格式'];
  var body = parts.map(function (t, i) { return labelled ? '<span class="part p' + (i + 1) + '"><small>' + names[i] + '</small>' + t + '</span>' : t; }).join(labelled ? '' : '');
  return labelled ? '<span class="parts">' + body + '</span>' : body;
}
function liveHead(h, toolKey) {
  var id = DECK.resolveTool(toolKey);
  return '<p class="small"><span class="tag">現場示範</span>　<b>' + h.toolLink(id) + '</b>　' + h.dot(id) + '</p>';
}
function toolChip(h, e) {
  return '<span class="card" style="display:inline-flex;gap:10px;align-items:center;padding:8px 14px;margin:0 10px 10px 0;font-size:22px"><b>' +
    h.toolLink(e.id) + '</b>' + h.dot(e.id) + (e.id === 'poe' ? '<span class="meta">' + h.poeNote + '</span>' : '') + '</span>';
}

var U1_PARTS = ['你是一位幼稚園老師。', '對象是 K2（4 至 5 歲）幼兒。', '請為「秋天」主題設計 3 條引發討論的提問。', '每條不多於 20 字，用正面語氣及繁體中文。', '以編號列出，每條附一句老師跟進說法。'];

PAGES.push(
  /* 1 Cover */
  { seg: 1, kind: 'cover', raw: true, title: '封面', reqs: [13, 1, 11],
    html: function (h) {
      return '<div style="position:absolute;left:120px;top:210px;right:120px">' +
        '<p class="kicker" style="font-size:28px">世佛會屬校聯校教師培訓</p>' +
        '<h1 style="position:static;width:auto;font-size:72px;line-height:1.2;margin:16px 0 48px">AI 工具於幼兒教育的應用 — 聯校教師培訓</h1>' +
        '<p style="font-size:40px;font-weight:700;margin:0 0 18px">' + h.bind('school') + '</p>' +
        '<p style="font-size:32px;margin:0 0 8px">' + h.bind('date') + '　' + h.bind('time') + '</p>' +
        '<p style="font-size:32px;margin:0 0 56px">地點：' + h.bind('venue') + '</p>' +
        '<p style="font-size:30px;margin:0">培訓機構：' + h.bind('provider') + '</p></div>';
    },
    notes: function () { return ['歡迎各位老師，介紹今日目標：聽得懂、跟得上、即日能用。', '按 H 可隨時開關講者備註；按 F 進入全屏。'];
    } },
  /* 2 全日流程 (header seg 1) */
  { seg: 1, kind: 'header', title: '今日流程', reqs: [23, 22, 10],
    html: function (h) {
      return segMeta(h, 1) + '<table class="t"><thead><tr><th style="width:260px">時間</th><th>內容</th><th style="width:260px">形式</th></tr></thead><tbody>' +
        h.tl.map(function (t) {
          return '<tr' + (t.n === 5 ? ' class="lunch"' : '') + '><td>' + t.start + '–' + t.end + '</td><td>' + t.title + '</td><td>' +
            (t.modes.length ? t.modes.join('、') : '<span class="tag plain">休息</span>') + '</td></tr>';
        }).join('') + '</tbody></table>';
    },
    notes: function () { return ['逐段簡介全日安排，強調每個單元都有動手時間。', '午膳後由繪本開始，最後帶走行動計劃。']; } },
  /* 3 期望設定 */
  { seg: 1, kind: 'content', title: '今日三個目標', reqs: [23],
    html: function () {
      return '<div class="grid g3 reveal">' +
        '<div class="card accent"><h3>聽得懂</h3><p class="small">用生活例子講人工智能（AI），不用背術語。</p></div>' +
        '<div class="card accent"><h3>跟得上</h3><p class="small">每一步都有示範，再跟着做一次。</p></div>' +
        '<div class="card accent"><h3>即日能用</h3><p class="small">今日完成的成品，回校即可使用。</p></div></div>' +
        '<div class="box" style="margin-top:40px"><span class="tag">討論</span>　你最想 AI 幫你減少哪一項工作？</div>';
    },
    notes: function () { return ['請老師在小組內分享最花時間的文書工作。', '記下兩三個例子，下午回應。']; } },
  /* 4 香港可用工具地圖 */
  { seg: 1, kind: 'content', title: '香港可用工具地圖', reqs: [23, 15, 16, 14], matrix: true,
    html: function (h) {
      var ok = h.tools(function (e) { return h.hkOK(e.id) && e.group !== '不列入'; });
      var no = h.tools(function (e) { return !h.hkOK(e.id); });
      return '<p class="small"><b>今日只用香港可直用、免虛擬私人網絡（VPN）的工具。</b>VPN：令上網連線「繞道」到別處的工具，例如用來開啟香港未支援的網站——今日不會這樣做。</p>' +
        '<div class="grid" style="grid-template-columns:1.7fr 1fr;margin-top:12px"><div><h3 style="margin:0 0 10px;font-size:28px">香港可直用</h3>' + ok.map(function (e) { return toolChip(h, e); }).join('') + '</div>' +
        '<div><h3 style="margin:0 0 10px;font-size:28px">香港不可直用</h3>' + no.map(function (e) { return toolChip(h, e); }).join('') + '</div></div>' + h.disclaimer();
    },
    notes: function () { return ['綠點代表香港可直接使用；紅點代表官方不支援香港。', '想試 ChatGPT 類工具，可改用 Poe 或 Microsoft Copilot。']; } },
  /* 5 香港可用性與 VPN 政策 */
  { seg: 1, kind: 'content', title: '香港可用性與 VPN 政策', reqs: [15, 16, 14],
    html: function (h) {
      var row = function (id, label, say, alt, note) {
        return '<tr><td><b>' + h.link(h.field(id, 'url'), label) + '</b></td><td>' + h.dot(id) + '</td><td>' + say + '</td><td>' + alt + (note ? '<br><span class="meta">' + note + '</span>' : '') + '</td></tr>';
      };
      var fixed = function (id, text) { return h.hkOK(id) ? h.esc(h.field(id, 'note')) : text; };
      return '<p style="font-size:44px;font-weight:700;margin:0 0 8px;color:var(--red)">不建議、不示範、不教 VPN</p>' +
        '<p class="small">適用於培訓現場及回校使用。原因：可能違反平台服務條款；帳戶有被停用的風險；學校資料保安風險。</p>' +
        '<table class="t" style="font-size:22px"><thead><tr><th style="width:280px">平台</th><th style="width:200px">香港狀態</th><th>講解說法</th><th style="width:320px">香港替代方案</th></tr></thead><tbody>' +
        row('chatgpt', 'ChatGPT（OpenAI 官方）', fixed('chatgpt', '很出名，但香港官方不可直用；帳戶風險。不要用 VPN。想試 GPT 類 → Poe 或 Copilot。'), 'Poe、Microsoft Copilot', h.poeNote) +
        row('claude', 'Claude（Anthropic 官方）', fixed('claude', '長文很強，但香港官方介面不可直用。想試類似能力 → Poe。'), 'Poe', '') +
        row('doubao', '豆包', fixed('doubao', '主要面向內地消費者，不列入老師必備工具。'), '—', '') +
        '</tbody></table><p class="meta" style="margin-top:10px">應用程式介面（API）：讓程式之間互相傳送資料的接駁口，例如學校系統自動取天氣資料。</p>' + h.disclaimer();
    },
    notes: function () { return ['重點：不用 VPN、不代註冊、不共用帳戶。', 'Poe 可試多個模型，但不是 ChatGPT／Claude 官方帳戶。']; } },

  /* 6 單元一 header */
  { seg: 2, kind: 'header', cat: 'why', title: '單元一：AI 基礎認識與工具介紹', reqs: [9, 24, 18],
    html: function (h) {
      return moduleHeader(h, 2, ['用生活例子明白 AI 是甚麼', '學會提示詞（Prompt）公式，一次寫清楚要求', '分清哪些工具在香港可直接用', '知道哪些資料不可以輸入']);
    },
    notes: function () { return ['本單元先打好基礎，下午所有單元都會用到同一條公式。']; } },
  /* 7 AI 是甚麼 */
  { seg: 2, kind: 'content', title: 'AI 是甚麼？', reqs: [24, 8, 6],
    html: function () {
      var L = [[200, [130, 260, 390]], [560, [90, 200, 310, 420]], [920, [200, 320]]];
      var svg = '<svg class="nn" viewBox="0 0 1100 560" width="860" height="438" role="img" aria-label="神經網絡簡化圖解">';
      for (var a = 0; a < 2; a++) L[a][1].forEach(function (y1) { L[a + 1][1].forEach(function (y2) { svg += '<line x1="' + L[a][0] + '" y1="' + y1 + '" x2="' + L[a + 1][0] + '" y2="' + y2 + '"/>'; }); });
      L.forEach(function (layer) { layer[1].forEach(function (y) { svg += '<circle class="pulse" cx="' + layer[0] + '" cy="' + y + '" r="28"/>'; }); });
      svg += '<text x="200" y="40" text-anchor="middle">輸入層</text><text x="560" y="40" text-anchor="middle">隱藏層</text><text x="920" y="40" text-anchor="middle">輸出層</text>' +
        '<text x="200" y="490" text-anchor="middle">長耳朵、白色毛</text><text x="920" y="420" text-anchor="middle">兔子</text></svg>';
      return '<div class="grid" style="grid-template-columns:780px 1fr;gap:40px"><div>' +
        '<div class="box" style="font-size:34px;font-weight:700">很會模仿與重組的助手，不是有靈魂的老師</div>' +
        '<p style="margin-top:24px"><b>AI：</b>電腦從大量例子學會規律，再按你的要求產生內容。</p><p class="small">例如：輸入「秋天」，它寫出三條給 K2 的提問。</p>' +
        '<p style="margin-top:24px"><b>神經網絡（Neural Network）：</b>一層層小計算點，合力由例子找出特徵。</p><p class="small">例如：看到「長耳朵、白色毛」，認出是兔子。</p></div>' +
        '<div>' + svg + '</div></div>';
    },
    notes: function () { return ['強調 AI 會出錯，老師永遠是把關的人。', '圖解只示意：輸入特徵，經隱藏層計算，得出答案。']; } },
  /* 8 術語卡 */
  { seg: 2, kind: 'content', title: '三個常見術語（按卡片翻面）', reqs: [24, 8, 6],
    html: function () {
      var card = function (front, back, ex) {
        return '<button type="button" class="term" data-interactive aria-label="' + front + '（按一下翻面）"><span class="inner"><span class="face front">' + front + '<span class="hint">按一下看解釋</span></span>' +
          '<span class="face back"><span>' + back + '</span><span class="small">' + ex + '</span></span></span></button>';
      };
      return '<div class="terms">' +
        card('大型語言模型（LLM）', '讀過大量文字、很會接話和寫作的電腦程式。', '例如：幫你起草一封家長信。') +
        card('自然語言處理（NLP）', '讓電腦明白及處理人類語言的技術。', '例如：把粵語口語稿轉成書面語。') +
        card('提示詞（Prompt）', '你交給 AI 的指示，寫得越清楚，結果越好。', '例如：為 K2 寫 3 條秋天提問。') + '</div>';
    },
    notes: function () { return ['逐張翻卡，請老師用自己的話再講一次。']; } },
  /* 9 Live: Gemini */
  { seg: 2, kind: 'live', cat: 'demo', tool: 'gemini', title: '示範：一條好 Prompt 的效果', reqs: [17, 24, 9], uses: ['gemini'],
    prompt: U1_PARTS.join(''),
    steps: ['開啟 gemini.google.com，以個人帳戶登入。', '貼上頁面上的 Prompt。', '按送出，讀出結果。', '指出五個部分如何影響結果。', '請老師提出一項修改（例如改為 K1）再試一次。'],
    html: function (h, p) {
      return h.ready() + liveHead(h, 'gemini') + '<p class="kicker">所用 Prompt</p><div class="prompt">' + h.esc(p.prompt) + '</div>' +
        h.fallback('<ol class="small" style="margin:6px 0 0"><li>樹葉為甚麼會變色？——「我們一起去公園找找看。」</li><li>秋天你會穿甚麼衣服？——「摸摸外套，它厚不厚？」</li><li>你最喜歡秋天哪種水果？——「我們來畫出它的顏色。」</li></ol>');
    },
    notes: function () { return ['示範重點是公式，不是工具。']; } },
  /* 10 Prompt 公式 */
  { seg: 2, kind: 'content', cat: 'steps', title: 'Prompt 公式：五個部分', reqs: [24, 9, 7],
    html: function () {
      var names = ['角色', '對象（幼兒年齡）', '任務', '限制（字數／正面語氣／繁中）', '輸出格式'];
      return '<ol class="points reveal">' + names.map(function (n, i) { return '<li><span class="part p' + (i + 1) + '">' + n + '</span>　<span class="small">' + U1_PARTS[i] + '</span></li>'; }).join('') + '</ol>' +
        '<p class="kicker" style="margin-top:12px">完整 Prompt</p><div class="prompt">' + U1_PARTS.join('') + '</div>';
    },
    notes: function () { return ['五個部分缺一不可；限制最常被忘記。', '完整 Prompt 與剛才示範的完全相同。']; } },
  /* 11 Matrix A */
  { seg: 2, kind: 'content', title: '香港可直用工具：主力（現場優先示範）', reqs: [25, 17, 14, 7], matrix: true,
    html: function (h) { return matrixCards(h, '主力', 3) + h.disclaimer(); },
    notes: function () { return ['現場只深入示範 Gemini、' + DECK.secondName() + ' 及 Canva。', '其餘卡片是速查卡，回校可自行試。']; } },
  /* 12 Matrix B */
  { seg: 2, kind: 'content', title: '香港可直用工具：也很實用', reqs: [25, 16, 14, 7], matrix: true,
    html: function (h) {
      var one = h.tools(function (e) { return e.group === '一句帶過' && h.hkOK(e.id); });
      var oneHtml = one.length ? '<p class="kicker" style="margin-top:16px">一句帶過</p>' + one.map(function (e) {
        return '<div class="oneliner card"><b>' + h.toolLink(e.id) + '</b>' + h.dot(e.id) + '<span>' + h.esc(h.field(e.id, 'use')) + '。' + h.esc(h.field(e.id, 'note')) + '</span><span class="meta">' + h.link(e.url) + '</span></div>';
      }).join('') : '';
      return '<p class="kicker">也很實用</p>' + matrixCards(h, '也很實用', 4) + oneHtml + h.disclaimer();
    },
    notes: function () { return ['HKChat 適合起草粵語家長溝通草稿，但不作唯一主力。', 'Manus 不在現場主力示範。它可幫老師做多步研究，以及簡報、報告或網頁草稿；成品要老師審。不要輸入幼兒姓名、照片或個案。免費積分用完可改訂閱方案。校園計劃不是幼稚園預設。']; } },
  /* 13 安全提示 */
  { seg: 2, kind: 'content', title: '安全提示：輸入前先想一想', reqs: [20, 24],
    html: function () {
      return '<ul class="points reveal" style="font-size:34px"><li>勿輸入幼兒全名及照片</li><li>勿輸入家長電話及地址</li><li>勿輸入評估及個案資料</li><li>勿輸入校內敏感資料</li><li>先用「［幼兒名］」等佔位符代替</li></ul>';
    },
    notes: function () { return ['任何工具都適用；有疑問就不要輸入。']; } },
  /* 14 小試 */
  { seg: 2, kind: 'exercise', cat: 'try', title: '2 分鐘小試：寫你班的 Prompt', reqs: [9, 24, 15], uses: ['gemini'],
    html: function (h) {
      return exercise(h, '按五個部分，為自己班別寫一條 Prompt。', ['選一個本週主題。', '逐一寫出五個部分。', '貼到工具試一次。'], h.toolLink('gemini') + ' 或 ' + h.toolLink(DECK.secondId()),
        '你是一位幼稚園老師。對象是 K1（3 至 4 歲）幼兒。請為「洗手」主題寫一首 4 句短兒歌。每句不多於 7 字，正面語氣，繁體中文。以編號列出。');
    },
    notes: function () { return ['巡視時提醒加入「限制」部分。']; } }
);

function matrixCards(h, group, cols) {
  var demo = ['gemini', DECK.secondId(), 'canva'];
  var list = h.tools(function (e) { return e.group === group && h.hkOK(e.id); });
  return '<div class="mx" style="grid-template-columns:repeat(' + cols + ',1fr)">' + list.map(function (e) {
    var f = function (k) { return h.esc(h.field(e.id, k)); };
    return '<div class="card' + (demo.indexOf(e.id) >= 0 ? ' accent' : '') + '"><h3><span>' + h.toolLink(e.id) + '</span>' + (demo.indexOf(e.id) >= 0 ? '<span class="tag">現場示範</span>' : '') + '</h3>' +
      h.dot(e.id) + '<dl><dt>用途</dt><dd>' + f('use') + '</dd><dt>繁中表現</dt><dd>' + f('zh') + '</dd><dt>免費起步</dt><dd>' + f('free') + '</dd><dt>幼教適合度</dt><dd>' + f('fit') + '</dd><dt>注意事項</dt><dd>' + f('note') + '</dd></dl>' +
      '<div class="meta">' + h.link(e.url) + '</div>' + (e.id === 'poe' ? '<div class="meta"><b>' + h.poeNote + '</b></div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* Pages: 時段三至五（第 15 至 26 頁） */
var U2_PLAN = ['你是一位幼稚園老師。', '對象是 K2（4 至 5 歲）幼兒。', '請以「秋天的樹葉」為主題，設計一節 30 分鐘、以遊戲為本的教案。', '註明學習範疇，不用抄寫、默書或工作紙，用繁體中文。', '按「主題、對象、學習範疇、學習目標、材料、活動流程（提問 → 遊戲 → 區角活動）」列出。'];
var U2_LETTER = ['你是一位幼稚園老師。', '讀者是 K2（4 至 5 歲）幼兒的家長。', '請把以下粵語口語稿改寫成書面語家長信。', '語氣禮貌清楚，不多於 150 字，用繁體中文。', '以「各位家長：」開頭，最後署名「［老師名］」。'];
var U2_GOOD = ['你是一位幼稚園老師。', '對象是 K1（3 至 4 歲）幼兒。', '請設計一節「水果」主題、20 分鐘的遊戲活動。', '不多於 200 字，正面語氣，繁體中文。', '以「目標／材料／步驟」列出。'];

PAGES.push(
  /* 15 單元二 header */
  { seg: 3, kind: 'header', cat: 'why', title: '單元二：AI 協助日常教學活動', reqs: [9, 26, 18],
    html: function (h) {

<script id="app">
/* Runtime part 1: utilities, data access, validation (System_Warning) and page helpers */
var DECK = (function () {
  'use strict';
  var CFG = SESSION_CONFIG, REG = REGISTRY, TL = TIMELINE;
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var PENDING = '待設定', OK = '香港可直用', NO = '香港不可直用';
  var MODULE_SEGS = [2, 3, 6, 7, 8, 9];
  var APPROVED = ['C1', 'C2', 'C3', 'C4', 'C5', 'M1', 'M2', 'M3', 'M4', 'M5', 'T1', 'T2', 'T3', 'T4', 'T5'];
  var LABEL = { manjusri: '場次一', mantra: '場次二' };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function empty(v) { return v === undefined || v === null || (typeof v === 'string' && v.trim() === '') || (Array.isArray(v) && v.length === 0); }
  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }
  function utc(s) { var p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function isTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  function weekday(s) { return WEEK[new Date(utc(s)).getUTCDay()]; }
  function chineseDate(s) { var p = s.split('-').map(Number); return p[0] + ' 年 ' + p[1] + ' 月 ' + p[2] + ' 日（' + weekday(s) + '）'; }

  /* ---------- Session_Config ---------- */
  var SESSION_FIELDS = ['label', 'date', 'start', 'end', 'lunchStart', 'lunchEnd', 'school', 'venue', 'headcount', 'factIds', 'facts', 'hooks'];
  function sessionErrors(key) {
    var s = (CFG.sessions || {})[key], bad = [];
    if (!s) return SESSION_FIELDS.slice();
    SESSION_FIELDS.forEach(function (f) { if (empty(s[f]) || (f === 'facts' && typeof s.facts === 'object' && Object.keys(s.facts).length === 0)) bad.push(f); });
    if (bad.indexOf('date') < 0 && !isDate(s.date)) bad.push('date');
    ['start', 'end', 'lunchStart', 'lunchEnd'].forEach(function (f) { if (bad.indexOf(f) < 0 && !isTime(s[f])) bad.push(f); });
    if (bad.indexOf('headcount') < 0 && !(Number.isInteger(s.headcount) && s.headcount > 0)) bad.push('headcount');
    [['start', 'end'], ['lunchStart', 'lunchEnd']].forEach(function (pr) {
      if (bad.indexOf(pr[0]) < 0 && bad.indexOf(pr[1]) < 0 && mins(s[pr[0]]) >= mins(s[pr[1]])) { bad.push(pr[0]); bad.push(pr[1]); }
    });
    return bad;
  }
  function S(key, field) {
    var s = (CFG.sessions || {})[key];
    return (s && sessionErrors(key).indexOf(field) < 0) ? s[field] : PENDING;
  }
  function sharedErrors() {
    var sh = CFG.shared || {}, bad = [];
    ['providerConstant', 'footerProvider', 'secondTool', 'buildDate', 'facts'].forEach(function (f) { if (empty(sh[f])) bad.push(f); });
    if (bad.indexOf('footerProvider') < 0 && ['開啟', '關閉'].indexOf(sh.footerProvider) < 0) bad.push('footerProvider');
    if (bad.indexOf('secondTool') < 0 && ['DeepSeek', 'Qwen'].indexOf(sh.secondTool) < 0) bad.push('secondTool');
    if (bad.indexOf('buildDate') < 0 && !isDate(sh.buildDate)) bad.push('buildDate');
    if (bad.indexOf('facts') < 0 && ['C1', 'C2', 'C3', 'C4', 'C5'].some(function (c) { return empty(sh.facts[c]); })) bad.push('facts');
    return bad;
  }
  function shared(f) { return sharedErrors().indexOf(f) < 0 ? CFG.shared[f] : null; }
  function provider() { return shared('providerConstant') || PENDING; }
  function footerOn() { return shared('footerProvider') === '開啟'; }
  function secondKey() { return shared('secondTool') || 'DeepSeek'; }
  function secondId() { return secondKey().toLowerCase(); }
  function secondName() { var e = entry(secondId()); return (e && e.name) || secondKey(); }
  function resolveTool(t) { return t === 'second' ? secondId() : t; }

  function hookProblems(key, hook) {
    var s = CFG.sessions[key] || {}, allowed = Array.isArray(s.factIds) ? s.factIds : [], why = [];
    if (!hook || !Array.isArray(hook.facts) || hook.facts.length === 0) why.push('沒有引用事實編號');
    else hook.facts.forEach(function (f) {
      if (APPROVED.indexOf(f) < 0) why.push(f + ' 不屬 Approved_Fact_List');
      else if (allowed.indexOf(f) < 0) why.push(f + ' 不屬此場次可引用的事實');
    });
    if (!hook || MODULE_SEGS.indexOf(hook.seg) < 0) why.push('所屬時段不是單元時段');
    if (!hook || empty(hook.text)) why.push('沒有文字');
    return why;
  }
  function validHooks(key, seg) {
    var s = CFG.sessions[key];
    if (!s || !Array.isArray(s.hooks)) return [];
    return s.hooks.filter(function (h) { return h && h.seg === seg && hookProblems(key, h).length === 0; });
  }

  /* ---------- Availability_Registry ---------- */
  var BY_ID = {};
  REG.forEach(function (e) { if (e && e.id) BY_ID[e.id] = e; });
  var ENUMS = {
    category: ['工具', '功能', '教育方案', '政策'], hk: [OK, NO], group: ['主力', '也很實用', '一句帶過', '不列入'],
    zh: ['佳', '良', '一般'], fit: ['高', '中', '低'], kind: ['文字', '圖像生成', '動畫', '數字人', '語音', '音樂'],
    fee: ['免費', '付費', '需 Canva Education'], region: ['有', '沒有'], route: ['老師個人', '整校申請', '機構購買'], kgDefault: ['適用', '不適用']
  };
  var REQ = {
    '工具': ['url', 'hk', 'group', 'use', 'zh', 'free', 'fit', 'note'],
    '功能': ['tool', 'kind', 'hk', 'fee', 'region'],
    '教育方案': ['org', 'audience', 'route', 'fee', 'privacy', 'kgDefault'],
    '政策': ['issuer', 'scope']
  };
  function verifiedOK(e) {
    if (!isDate(e.verified)) return false;
    var bd = shared('buildDate');
    return !bd || utc(e.verified) <= utc(bd);
  }
  function entryErrors(e) {
    var bad = [];
    ['id', 'name', 'category', 'claim', 'source', 'verified'].forEach(function (f) { if (empty(e[f])) bad.push(f); });
    if (bad.indexOf('category') < 0 && ENUMS.category.indexOf(e.category) < 0) bad.push('category');
    if (bad.indexOf('verified') < 0 && !verifiedOK(e)) bad.push('verified');
    (REQ[e.category] || []).forEach(function (f) {
      if (empty(e[f])) bad.push(f);
      else if (ENUMS[f] && !(f === 'fee' && e.category === '教育方案') && ENUMS[f].indexOf(e[f]) < 0) bad.push(f);
    });
    if (e.category === '工具' && e.hk === NO && empty(e.alt)) bad.push('alt');
    if (e.category === '功能' && e.tool && !BY_ID[e.tool]) bad.push('tool');
    return bad;
  }
  function entry(id) { return BY_ID[id] || null; }
  function hkOK(id) { var e = entry(id); return !!e && e.hk === OK; }
  function field(id, f) { var e = entry(id); if (!e) return PENDING; return entryErrors(e).indexOf(f) < 0 ? e[f] : PENDING; }
  function verifiedText(id) { var e = entry(id); return (e && verifiedOK(e)) ? e.verified : '未註明日期'; }
  function tools(filter) { return REG.filter(function (e) { return e.category === '工具' && (!filter || filter(e)); }); }
  function functions(kinds) { return REG.filter(function (e) { return e.category === '功能' && kinds.indexOf(e.kind) >= 0 && e.hk === OK; }); }

  /* ---------- timeline ---------- */
  function timelineProblems(key) {
    var s = CFG.sessions[key] || {}, out = [];
    function add(n, code) { out.push({ n: n, code: code }); }
    if (!Array.isArray(TL) || TL.length !== 10) add('全部', 'a');
    (TL || []).forEach(function (t, i) {
      if (!t || t.n !== i + 1) add(t && t.n || i + 1, 'a');
      if (!t || !isTime(t.start) || !isTime(t.end) || mins(t.start) >= mins(t.end)) add(t && t.n || i + 1, 'b');
      var nx = TL[i + 1];
      if (nx && t && t.end !== nx.start) add(t.n, 'c');
      var modes = (t && t.modes) || [];
      var good = modes.every(function (m) { return ['示範', '動手', '討論'].indexOf(m) >= 0; });
      if (i === 4 ? modes.length !== 0 : (modes.length < 1 || modes.length > 3 || !good)) add(t && t.n || i + 1, 'f');
    });
    if (TL[0] && TL[0].start !== s.start) add(1, 'd');
    if (TL[9] && TL[9].end !== s.end) add(10, 'd');
    if (TL[4] && (TL[4].start !== s.lunchStart || TL[4].end !== s.lunchEnd)) add(5, 'e');
    return out;
  }
  function duration(t) { return (isTime(t.start) && isTime(t.end) && mins(t.start) < mins(t.end)) ? String(mins(t.end) - mins(t.start)) : PENDING; }

  /* ---------- System_Warning (需求 5 第 6 項) ---------- */
  function warnings(key, pages) {
    var w = [], label = LABEL[key] + '（' + key + '）';
    var se = sessionErrors(key);
    if (se.length) w.push(['需求 11 第 9 項', label + '欄位出錯：' + se.join('、')]);
    var sh = sharedErrors();
    if (sh.length) w.push(['需求 11 第 10 項', '共用設定欄位出錯：' + sh.join('、')]);
    var s = CFG.sessions[key];
    if (s && Array.isArray(s.hooks)) s.hooks.forEach(function (h, i) {
      var why = hookProblems(key, h);
      if (why.length) w.push(['需求 11 第 12 項', label + '第 ' + (i + 1) + ' 個校本例子（時段 ' + (h && h.seg) + '）：' + why.join('；')]);
    });
    var miss = MODULE_SEGS.filter(function (seg) { return validHooks(key, seg).length === 0; });
    if (miss.length) w.push(['需求 18 第 5 項', label + '以下時段沒有有效校本例子：' + miss.map(function (n) { return '時段' + n; }).join('、')]);
    REG.forEach(function (e, i) { var b = entryErrors(e); if (b.length) w.push(['需求 14 第 10 項', '第 ' + (i + 1) + ' 項 ' + (e.name || '') + ' 欄位出錯：' + b.join('、')]); });
    var sd = S(key, 'date'), stale = REG.filter(function (e) {
      if (!verifiedOK(e)) return true;
      return sd !== PENDING && (utc(sd) - utc(e.verified)) / 86400000 > 30;
    });
    if (stale.length) w.push(['需求 14 第 8 項', '以下 ' + stale.length + ' 項須於場次前重新核實。' + stale.map(function (e) { return '第 ' + (REG.indexOf(e) + 1) + ' 項 ' + e.name + '（' + verifiedText(e.id) + '）'; }).join('；')]);
    var watch = {};
    ['gemini', secondId(), 'canva'].forEach(function (id) { watch[id] = 1; });
    tools(function (e) { return ['主力', '也很實用', '一句帶過'].indexOf(e.group) >= 0; }).forEach(function (e) { watch[e.id] = 1; });
    pages.forEach(function (p) { (p.uses || []).forEach(function (id) { watch[id] = 1; }); });
    function affected(id) {
      var out = [];
      pages.forEach(function (p, i) {
        if ((p.uses || []).indexOf(id) >= 0 || (p.tool && resolveTool(p.tool) === id) || (p.matrix && entry(id) && entry(id).group !== '不列入')) out.push(i + 1);
      });
      return out.length ? out.join('、') : '—';
    }
    Object.keys(watch).forEach(function (id) {
      if (!hkOK(id)) w.push(['需求 15 第 6 項', (entry(id) ? entry(id).name : id) + ' 不是「香港可直用」，受影響頁：' + affected(id)]);
    });
    ['chatgpt', 'claude', 'doubao'].forEach(function (id) {
      if (hkOK(id)) w.push(['需求 15 第 6 項', entry(id).name + ' 已變為「香港可直用」，請更新講解說法，受影響頁：' + affected(id)]);
    });
    var tp = timelineProblems(key);
    if (tp.length) w.push(['需求 22 第 3 項', '時間軸不符合條件：' + tp.map(function (x) { return '時段' + x.n + '（' + x.code + '）'; }).join('、')]);
    return w;
  }

  function link(url, label) {
    var raw = String(url || '').trim();
    var href = /^https?:\/\//i.test(raw) ? raw : (/^[\w.-]+\.[A-Za-z]{2,}/.test(raw) ? 'https://' + raw : '');
    var host = raw.replace(/^https?:\/\//i, '').replace(/\/$/, '').split('/')[0].replace(/^www\./, '');
    var text = label || host;
    if (!href) return esc(text);
    return '<a class="ext" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>';
  }
  function toolLink(id) { var e = entry(id); return e ? link(e.url, e.name) : esc(id); }

  /* ---------- helpers used by pages.js ---------- */
  var h = {
    esc: esc,
    second: secondName,
    toolName: function (t) { var id = resolveTool(t); return entry(id) ? entry(id).name : id; },
    dot: function (id) {
      var ok = hkOK(id);
      return '<span class="st ' + (ok ? 'ok' : 'no') + '" data-st="' + esc(id) + '"><span class="d" aria-hidden="true"></span><span>' + (ok ? OK : NO) + '</span></span>';
    },
    link: link,
    toolLink: toolLink,
    disclaimer: function () { return '<div class="disclaimer">以官方當日為準</div>'; },
    bind: function (name) { return '<span data-bind="' + name + '"></span>'; },
    ready: function () { return '<span class="tag warm ready">今日回校就能用</span>'; },
    hookSlot: function (seg) { return '<div class="hook" data-hook-slot="' + seg + '"></div>'; },
    opt: function (title, body) {
      return '<div class="opt" data-interactive><div class="opt-head"><span class="tag plain">選做</span><b>' + title +
        '</b><button type="button" class="opt-toggle" data-interactive aria-expanded="false">展開</button></div><div class="opt-body">' + body + '</div></div>';
    },
    answer: function (body) {
      return '<div><button type="button" class="ctl" data-show="answer" data-interactive>顯示範例答案</button>' +
        '<div class="answer"><span class="label">範例答案：</span>' + body + '</div></div>';
    },
    fallback: function (body) {
      return '<div><button type="button" class="ctl" data-show="fallback" data-interactive>顯示示例輸出</button>' +
        '<div class="fallback"><div class="label">示例輸出</div>' + body + '</div></div>';
    },
    poeNote: 'Poe 不是 ChatGPT／Claude 官方帳戶',
    entry: entry, field: field, hkOK: hkOK, tools: tools, functions: functions, reg: REG, tl: TL, duration: duration,
    fee: function (id) { var f = field(id, 'fee'); return '<span class="tag plain">' + esc(f) + '</span>'; },
    shared: function (f) { return shared(f); }
  };

  return {
    CFG: CFG, REG: REG, TL: TL, LABEL: LABEL, PENDING: PENDING, MODULE_SEGS: MODULE_SEGS,
    esc: esc, isDate: isDate, weekday: weekday, chineseDate: chineseDate,
    sessionErrors: sessionErrors, sharedErrors: sharedErrors, S: S, provider: provider, footerOn: footerOn,
    secondName: secondName, secondId: secondId, resolveTool: resolveTool, validHooks: validHooks, hookProblems: hookProblems,
    entry: entry, entryErrors: entryErrors, hkOK: hkOK, verifiedText: verifiedText, timelineProblems: timelineProblems,
    duration: duration, warnings: warnings, h: h
  };
})();

/* Runtime part 2: rendering, navigation, session switching, interactions */
(function () {
  'use strict';
  var D = DECK, h = D.h, pages = PAGES;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var stage = $('#stage'), slidesEl = $('#slides'), notesEl = $('#notes');
  var state = { key: 'manjusri', index: 0 };
  var N = pages.length;

  /* ---------- web font: never wait longer than 3 s (需求 1 第 5 項) ---------- */
  var font = $('#webfont');
  setTimeout(function () { if (font && !font.dataset.loaded) font.remove(); }, 3000);

  /* ---------- initial session from URL (需求 12 第 1 至 3 項) ---------- */
  var params = new URLSearchParams(location.search);
  if (params.has('school')) {
    var v = (params.get('school') || '').toLowerCase();
    if (v === 'manjusri' || v === 'mantra') state.key = v;
    else console.warn('URL 參數 school 的值無效：「' + params.get('school') + '」，已改用 manjusri。');
  }

  /* ---------- build slides ---------- */
  pages.forEach(function (p, i) {
    var sec = document.createElement('section');
    sec.className = 'slide' + (p.cls ? ' ' + p.cls : '');
    sec.dataset.i = i;
    sec.dataset.seg = p.seg;
    sec.dataset.reqs = p.reqs.join(',');
    sec.dataset.kind = p.kind;
    if (p.cat) sec.dataset.cat = p.cat;
    if (p.tool) sec.dataset.tool = D.resolveTool(p.tool);
    var body = p.html(h, p);
    sec.innerHTML = p.raw ? body : '<h1>' + p.title + (p.seg === 'A' ? '<span class="appx-mark">附錄</span>' : '') + '</h1><div class="content">' + body + '</div>';
    slidesEl.appendChild(sec);
  });
  var slides = $$('.slide', slidesEl);

  /* ---------- chrome ---------- */
  var dots = $('#dots');
  pages.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.interactive = ''; b.dataset.go = i;
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 頁');
    b.innerHTML = '<i></i>';
    dots.appendChild(b);
  });
  var tlBar = $('#timeline-bar');
  D.TL.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.interactive = ''; b.dataset.seg = t.n;
    b.textContent = t.start + ' ' + t.short;
    tlBar.appendChild(b);
  });
  var printArea = $('#print-area'), planSlide = slides.filter(function (s) { return s.classList.contains('plan'); })[0];
  if (planSlide) printArea.innerHTML = planSlide.innerHTML.replace(/<span class="appx-mark">.*?<\/span>/, '');

  /* ---------- session application (需求 11、12) ---------- */
  function binds(key) {
    var S = function (f) { return D.S(key, f); }, P = D.PENDING;
    var date = S('date'), st = S('start'), en = S('end'), ls = S('lunchStart'), le = S('lunchEnd');
    return {
      school: S('school'), venue: S('venue'), label: S('label'),
      date: date === P ? P : D.chineseDate(date),
      time: (st === P || en === P) ? P : st + '–' + en,
      lunch: (ls === P || le === P) ? P : ls + '–' + le,
      afternoon: le === P ? P : '下午 ' + le + ' 開始',
      provider: D.provider()
    };
  }
  function applySession(key) {
    state.key = key;
    var b = binds(key);
    $$('[data-bind]').forEach(function (el) { var v = b[el.dataset.bind]; if (v !== undefined && el.textContent !== v) el.textContent = v; });
    $$('[data-hook-slot]').forEach(function (slot) {
      var hooks = D.validHooks(key, +slot.dataset.hookSlot);
      slot.hidden = hooks.length === 0;
      slot.innerHTML = hooks.map(function (x) { return '<div class="hook-item"><span class="tag warm">校本例子</span>' + D.esc(x.text) + '</div>'; }).join('');
    });
    $('#session-tag').textContent = b.label;
    var other = key === 'manjusri' ? 'mantra' : 'manjusri';
    $('#session-switch').textContent = '切換至' + D.LABEL[other];
    renderNotes();
  }
  function switchSession() {
    var next = state.key === 'manjusri' ? 'mantra' : 'manjusri';
    applySession(next);
    try {
      var u = new URL(location.href);
      u.searchParams.set('school', next);
      history.replaceState(history.state, '', u.toString());
    } catch (e) {
      console.warn('URL 參數 school 未能更新：' + e.message);
    }
  }

  /* ---------- notes (需求 5) ---------- */
  function notesHtml() {
    var p = pages[state.index], out = [], i = state.index;
    if (p.kind === 'cover') {
      var w = D.warnings(state.key, pages);
      out.push('<h2>系統警告</h2>');
      out.push(w.length ? '<ol>' + w.map(function (x) { return '<li class="warn">警告（' + x[0] + '）：' + D.esc(x[1]) + '</li>'; }).join('') + '</ol>' : '<p>目前沒有系統警告。</p>');
    }
    if (p.kind === 'header') {
      var t = D.TL[p.seg - 1];
      out.push('<p><b>時段 ' + t.n + '：' + t.start + '–' + t.end + '</b>' + (t.modes.length ? '；形式：' + t.modes.join('、') : '') + '</p>');
    }
    if (p.kind === 'live') {
      if (!D.hkOK(D.resolveTool(p.tool))) out.push('<p class="warn">此工具狀態已變更，請改用示例輸出。</p>');
      var steps = typeof p.steps === 'function' ? p.steps(h, p) : p.steps;
      out.push('<h2>示範步驟</h2><ol>' + steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>');
      out.push(p.goal ? '<p><b>操作目標：</b>' + D.esc(p.goal) + '</p>' : '<p><b>Prompt 原文：</b>' + D.esc(p.prompt) + '</p>');
      out.push('<p>網絡或工具失效時，按「顯示示例輸出」。</p>');
    }
    var pts = p.notes(h, p);
    out.push('<h2>講解重點（第 ' + (i + 1) + ' 頁）</h2><ul>' + pts.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>');
    return out.join('');
  }
  function renderNotes() { if (!notesEl.hidden) notesEl.innerHTML = notesHtml(); }
  function toggleNotes() { notesEl.hidden = !notesEl.hidden; if (!notesEl.hidden) { notesEl.innerHTML = notesHtml(); notesEl.scrollTop = 0; } }

  /* ---------- navigation (需求 3、4、22) ---------- */
  function resetPage(sec) {
    $$('.answer.shown, .fallback.shown', sec).forEach(function (el) { el.classList.remove('shown'); });
    $$('.opt.open', sec).forEach(function (el) { el.classList.remove('open'); var b = $('.opt-toggle', el); b.textContent = '展開'; b.setAttribute('aria-expanded', 'false'); });
    $$('.term.flipped', sec).forEach(function (el) { el.classList.remove('flipped'); });
  }
  function go(i, force) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === state.index && !force) return;
    var old = slides[state.index];
    old.classList.remove('current');
    state.index = i;
    var cur = slides[i];
    resetPage(cur);
    cur.classList.add('current');
    var p = pages[i];
    $('#page-indicator').textContent = (i + 1) + ' / ' + N;
    $$('#dots button').forEach(function (b, k) { b.classList.toggle('now', k === i); if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    tlBar.hidden = p.kind === 'cover' || p.seg === 'A';
    $$('#timeline-bar button').forEach(function (b) { b.classList.toggle('now', +b.dataset.seg === p.seg); });
    var fp = $('#footer-provider');
    fp.hidden = !D.footerOn() || p.kind === 'cover' || p.kind === 'closing';
    fp.textContent = D.provider();
    renderNotes();
  }
  function headerOf(seg) { for (var k = 0; k < N; k++) if (pages[k].seg === seg && (pages[k].kind === 'header' || (seg === 1 && pages[k].kind === 'header'))) return k; return 0; }

  /* ---------- scaling (需求 2) ---------- */
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((vw - 1920 * s) / 2) + 'px';
    stage.style.top = Math.round((vh - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', function () { requestAnimationFrame(fit); });
  document.addEventListener('fullscreenchange', function () { requestAnimationFrame(fit); });

  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function toggleFullscreen() {
    var fail = function () { toast('全屏未能啟動，可改用瀏覽器本身的全屏功能（例如 F11）。'); };
    try {
      if (document.fullscreenElement) { document.exitFullscreen().catch(fail); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(fail); }
      else fail();
    } catch (e) { fail(); }
  }

  /* ---------- input ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = e.key, tag = (e.target && e.target.tagName) || '';
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
    if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown') { e.preventDefault(); blurActive(); go(state.index + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); blurActive(); go(state.index - 1); }
    else if (!typing && (k === 'f' || k === 'F')) { e.preventDefault(); toggleFullscreen(); }
    else if (!typing && (k === 'h' || k === 'H')) { e.preventDefault(); toggleNotes(); }
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') e.preventDefault(); });
  function blurActive() { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); }

  document.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var t = e.target;
    if (t.closest('#notes')) return;
    if (t.closest('a[href]')) return;
    var btn = t.closest('button, [data-interactive]');
    if (!btn) { if (t.closest('#stage')) go(state.index + 1); return; }
    if (btn.id === 'session-switch') return switchSession();
    if (btn.closest('#dots') && btn.dataset.go !== undefined) return go(+btn.dataset.go);
    if (btn.closest('#timeline-bar') && btn.dataset.seg) return go(headerOf(+btn.dataset.seg), true);
    if (btn.dataset.goto === 'appendix') return go(pages.findIndex(function (p) { return p.seg === 'A'; }));
    if (btn.dataset.show) {
      var box = btn.parentElement.querySelector('.' + btn.dataset.show);
      if (box) box.classList.add('shown');
      return;
    }
    if (btn.classList.contains('opt-toggle')) {
      var opt = btn.closest('.opt'), open = !opt.classList.contains('open');
      opt.classList.toggle('open', open);
      btn.textContent = open ? '收合' : '展開';
      btn.setAttribute('aria-expanded', String(open));
      return;
    }
    if (btn.classList.contains('term')) { btn.classList.toggle('flipped'); return; }
  });

  /* ---------- start ---------- */
  fit();
  applySession(state.key);
  slides[0].classList.add('current');
  state.index = 0;
  go(0, true);

  window.DECK_RUNTIME = { state: state, go: go, applySession: applySession, switchSession: switchSession, pages: pages, slides: slides, notesHtml: notesHtml, headerOf: headerOf };
})();
</script>
</body>
